title: Your Name
tagline: Software Engineer
description: >-
  I build things with code. This site is my portfolio — projects, skills, and experience.
url: "https://yourusername.github.io"      # your GitHub Pages URL, e.g. https://alice.github.io
baseurl: ""                                 # leave "" for a user site (username.github.io),
                                             # or "/repo-name" for a project site

# Contact / social — leave blank to hide a link
email: you@example.com
github_username: yourusername
linkedin_username: yourusername
twitter_username: ""

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
