---
layout: default
title: Blog
---
<h1>Blog</h1>
<p>Short updates and my thoughts on the world. Also follow me on medium for more updates: <a href="https://medium.com/@karan.vish17" target="_blank" rel="noopener">MEDIUM</a></p>

<div class="post-list">
  {% for post in site.posts %}
  <div class="post-list-item">
    <span class="meta">{{ post.date | date: "%b %-d, %Y" }}</span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </div>
  {% else %}
  <p>No posts yet.</p>
  {% endfor %}
</div>
